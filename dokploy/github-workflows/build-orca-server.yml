name: build-orca-server

# Place this file at .github/workflows/build-orca-server.yml in the repository
# that contains the dokploy/ directory (a fork of stablyai/orca, or a small
# deployment repository holding just dokploy/).
#
# Publishes ghcr.io/<owner>/orca-server:<orca_version> and :latest.

on:
  workflow_dispatch:
    inputs:
      orca_version:
        description: Orca release version without the leading v
        required: true
        type: string
      push_latest:
        description: Also tag the image as latest
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "orca-server-*"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-orca-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.orca_version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="$(curl -fsSL -H 'User-Agent: orca-dokploy-build' \
              https://api.github.com/repos/stablyai/orca/releases/latest \
              | jq -r '.tag_name' | sed 's/^v//')"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Resolve AppImage checksum
        id: checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          manifest="$(curl -fsSL -H 'User-Agent: orca-dokploy-build' \
            "https://github.com/stablyai/orca/releases/download/v${VERSION}/latest-linux.yml")"
          sha512="$(printf '%s\n' "${manifest}" | sed -n 's/^[[:space:]]*sha512:[[:space:]]*//p' | head -n1 | tr -d '[:space:]')"
          if [[ -z "${sha512}" ]]; then
            echo "No sha512 for v${VERSION}" >&2
            exit 1
          fi
          echo "sha512=${sha512}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./dokploy
          file: ./dokploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            ORCA_VERSION=${{ steps.version.outputs.version }}
            ORCA_APPIMAGE_SHA512=${{ steps.checksum.outputs.sha512 }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/orca-server:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/orca-server:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
